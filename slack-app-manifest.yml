# Slack App Manifest for Claude Slack Channel Bots
#
# ONE APP PER PERSONA: every persona is its own Slack app. Create one app from
# this manifest for each persona, and give each app its own name and avatar.
# You may change `display_information.name` and `features.bot_user.display_name`
# before creating the app, or change the name and avatar afterwards in the
# Slack admin UI.
#
# MANUAL STEPS REQUIRED after creating each app:
# 1. Go to Basic Information → App-Level Tokens and generate an app-level token
#    with the `connections:write` scope. Socket Mode needs it.
# 2. Install the app to the workspace to get its bot token.
# 3. Put both tokens in that persona's credentials file, the file named by the
#    persona's `credentials_file` setting in the server's config.json. The file
#    is a JSON object with exactly two keys: `bot_token` (the bot token) and
#    `app_token` (the app-level token). Once the persona is declared, run
#    `claude-slack-channel-bots credentials <persona>` in your terminal to
#    write it: it asks for both tokens without echo and checks them with Slack.
#
# RE-INSTALL EXISTING APPS: this manifest grants the `im:write` bot scope,
# which a persona needs to open a DM with a workspace user. An app created from
# an earlier version of this manifest must have `im:write` added and then be
# re-installed to gain it. Until then, opening a DM fails with `missing_scope`.
#
# It also grants the `channels:read` (public channels) and `groups:read`
# (private channels) bot scopes, which a persona needs to look up a channel's
# name from its ID (`conversations.info`) and to list its channels
# (`conversations.list`). An app created from an earlier version of this
# manifest must have `channels:read` and `groups:read` added and then be
# re-installed ("Reinstall to Workspace" under OAuth & Permissions) to gain
# them: until then, its bot token keeps its old scopes, both calls fail with
# `missing_scope`, and the message archive records the channel ID where the
# channel name should be.
#
# It also grants the `lists:read` and `lists:write` bot scopes, which a persona
# needs to read and write a Slack List it has been given access to, such as a
# list shared by all bots. CSCB itself makes no Lists call. An app created from
# an earlier version of this manifest must have `lists:read` and `lists:write`
# added and then be re-installed to gain them. Until then, every Lists call
# fails with `missing_scope`.
#
# Group DMs are deliberately not subscribed: do not add a group-DM event.

_metadata:
  major_version: 1

display_information:
  name: Claude Slack Channels Bot
  description: "A Claude Code bot persona, served over Socket Mode by Claude Slack Channel Bots"
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: Claude Slack Channels Bot
    always_online: true
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - reactions:write
      - channels:history
      - channels:read
      - im:history
      - im:write
      - files:read
      - files:write
      - users:read
      - app_mentions:read
      - groups:history
      - groups:read
      - lists:read
      - lists:write

settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.im
      - message.groups
      - app_mention
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
