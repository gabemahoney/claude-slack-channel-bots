# logrotate-startup-errors.conf
#
# Purpose: logrotate snippet for the append-only startup-errors.log written by
#          src/startup-errors.ts (part of claude-slack-channel-bots, CSCB).
#          CSCB never rotates this file itself; rotation is left to the OS
#          logrotate facility.
#
# Installation: copy this file to the system logrotate drop-in directory:
#
#   sudo cp docs/logrotate-startup-errors.conf \
#       /etc/logrotate.d/claude-slack-channel-bots
#
# WARNING — tilde (~) expansion:
#   logrotate does NOT expand ~ or $HOME in path patterns. The path below uses
#   the fully-qualified form. Replace USER with the OS account that runs CSCB
#   (e.g. "team", "ubuntu", "deploy"):
#
#     /home/USER/.config/claude-slack-channel-bots/startup-errors.log
#
# Custom state directory:
#   If the SLACK_STATE_DIR environment variable is set when CSCB launches, the
#   log is written to $SLACK_STATE_DIR/startup-errors.log instead. If you
#   changed SLACK_STATE_DIR, set XDG_CONFIG_HOME (the default is
#   $XDG_CONFIG_HOME/claude-slack-channel-bots), or if CSCB runs as a non-default OS user, update
#   the path in the stanza below accordingly.
#
# Tuning:
#   The directives below (weekly / rotate 4 / compress / delaycompress) are a
#   reasonable starting point. Adjust to match your site retention policy.

/home/USER/.config/claude-slack-channel-bots/startup-errors.log {
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
